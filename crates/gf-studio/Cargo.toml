[package]
name = "gf-studio"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "gazeforge-studio"
path = "src/main.rs"

[dependencies]
gf-api = { path = "../gf-api" }
gf-core = { path = "../gf-core" }
gf-geom = { path = "../gf-geom", features = ["parallel"] }
gf-io = { path = "../gf-io" }
serde_json = "1"
eframe = { version = "=0.35.0", default-features = false, features = ["wgpu"] }
pollster = "0.4"
rayon = "1"
png = "0.18"
