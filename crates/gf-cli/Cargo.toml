[package]
name = "gf-cli"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "gazeforge"
path = "src/main.rs"

[dependencies]
gf-api = { path = "../gf-api" }
gf-core = { path = "../gf-core" }
gf-geom = { path = "../gf-geom", features = ["parallel"] }
gf-io = { path = "../gf-io" }
serde_json = "1"

[dev-dependencies]
ndarray = "0.17.2"
ndarray-npy = "0.10.0"
